[mypy]
# MyPy Configuration for FlavorHub Recipe Manager
# Constitution Principle VI: Quality Standards - strict type checking

python_version = 3.11
strict = True

# Import discovery
mypy_path = .
namespace_packages = True
explicit_package_bases = True

# Strict type checking flags (already enabled by strict=True, but explicit for clarity)
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
check_untyped_defs = True
disallow_any_generics = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_calls = True
disallow_untyped_decorators = True
no_implicit_optional = True
strict_equality = True

# Error reporting
show_error_codes = True
show_column_numbers = True
show_error_context = True
pretty = True

# Warning configuration
warn_incomplete_stub = True

# Allow selective type ignoring when needed
ignore_missing_imports = False

# Per-module overrides (if needed for legacy code)
[mypy-models]
# Legacy models.py may not have full type hints yet
disallow_untyped_defs = False

[mypy-search.*]
# All new search modules MUST pass strict type checking
disallow_untyped_defs = True
disallow_incomplete_defs = True
